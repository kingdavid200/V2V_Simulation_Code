#
# omnetpp.ini  (attack configuration excerpts)
#
# These are the attack-scenario configurations used in the study, layered on
# top of the standard Veins RSUExampleScenario. Global network, mobility, and
# 802.11p parameters follow the Veins example defaults; the sections below add
# the attacker/IDS node assignments and parameters.
#
# NOTE: Reconstructed from development-session records. Reconcile against the
# authoritative omnetpp.ini on the simulation VM before archival submission.
#

# --- Global (excerpt) ---
# *.manager.updateInterval = 1s
# sim-time-limit is set per attack config below.

[Config PhantomAttackWithIDS]
# node[0] is the attacker; all other nodes run the IDS.
*.node[0].applType = "PhantomVehicleAttacker"
*.node[0].appl.phantomX = 300.0
*.node[0].appl.phantomY = 300.0
*.node[0].appl.phantomSpeed = 0.0
*.node[0].appl.phantomHeading = 0.0
*.node[0].appl.attackStartTime = 10.0
*.node[1..].applType = "V2VIDS"
*.node[1..].appl.windowSize = 10
*.node[1..].appl.detectionThreshold = 0.5
*.node[1..].appl.headerLength = 80 bit
*.node[1..].appl.sendBeacons = true
*.node[1..].appl.dataOnSch = false
*.node[1..].appl.beaconInterval = 1s

[Config ReplayAttackWithIDS]
# All nodes beacon (so the attacker has traffic to capture); the IDS runs in
# replay mode (duplicate-serial detection).
*.node[*].appl.sendBeacons = true
*.node[*].appl.beaconInterval = 0.1s
*.node[*].appl.replayMode = true
sim-time-limit = 50s
